<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Cross-Race Face Challenge | 실사 안면인식 스피드 테스트</title>
  <meta name="description" content="로그인 없이 바로 플레이! 100% 실사 사진으로 제한 시간 안에 머리스타일·안경 함정을 뚫고 진짜 이목구비를 구분해 보세요." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="🧠 Cross-Race 실사 안면인식 스피드 테스트" />
  <meta property="og:description" content="머리스타일·수염·안경 함정을 뚫고 진짜 동일 인물을 찾아보세요! 로그인 없이 클릭 즉시 플레이." />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  <style>
    :root {
      --bg: #0b1020;
      --card: #151d33;
      --card-2: #1c2744;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f6ff;
      --muted: #9aa7c7;
      --accent: #4f8cff;
      --accent-2: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: radial-gradient(circle at 50% 0%, #172342 0%, var(--bg) 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard", "Malgun Gothic", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    .app {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 0 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: -0.02em;
      cursor: pointer;
      min-width: 0;
    }
    .brand-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-badge {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border-radius: 8px;
      padding: 3px 6px;
      font-size: 0.74rem;
      flex-shrink: 0;
    }
    .top-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .icon-btn:active { transform: scale(0.95); }
    .lang-toggle {
      display: inline-flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 7px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .screen {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .screen.active { display: flex; }

    .hero-card, .panel {
      background: rgba(21, 29, 51, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 13px 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    .hero-title {
      font-size: 1.22rem;
      font-weight: 800;
      margin: 0 0 5px;
      line-height: 1.24;
    }
    .hero-sub {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.44;
      margin: 0;
    }
    .science-note {
      margin-top: 9px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(79, 140, 255, 0.11);
      border: 1px solid rgba(79, 140, 255, 0.28);
      font-size: 0.76rem;
      line-height: 1.42;
      color: #dbe7ff;
    }
    .section-label {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 700;
      margin: 2px 0 5px;
    }
    .speed-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .speed-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 11px;
      text-align: left;
      cursor: pointer;
    }
    .speed-btn.active {
      border-color: var(--accent-2);
      background: rgba(56, 189, 248, 0.14);
    }
    .speed-btn strong { display: block; font-size: 0.85rem; }
    .speed-btn span { font-size: 0.72rem; color: var(--muted); }

    .cat-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .cat-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(135deg, var(--card), var(--card-2));
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 15px;
      padding: 12px 13px;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease;
      text-align: left;
    }
    .cat-btn:active { transform: scale(0.985); }
    .cat-btn:hover { border-color: var(--accent); }
    .cat-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .cat-icon { font-size: 1.4rem; flex-shrink: 0; }
    .cat-title { font-weight: 800; font-size: 0.92rem; display: block; }
    .cat-desc { font-size: 0.73rem; color: var(--muted); display: block; margin-top: 2px; line-height: 1.3; }
    .cat-pill {
      background: rgba(255,255,255,0.08);
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent-2);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .back-btn:hover, .back-btn:active {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(79, 140, 255, 0.16);
      color: #bcd5ff;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .brief-box {
      text-align: center;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .brief-mode-tag {
      background: rgba(245, 158, 11, 0.16);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .brief-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0;
      line-height: 1.3;
    }
    .brief-text {
      font-size: 0.89rem;
      color: #d6e0f8;
      line-height: 1.48;
      margin: 0;
    }
    .preload-hint {
      font-size: 0.74rem;
      color: #93c5fd;
      font-weight: 700;
      min-height: 1.1em;
    }
    .primary-btn, .secondary-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }
    .primary-btn {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
    }
    .primary-btn:disabled {
      opacity: 0.72;
      cursor: wait;
    }
    .secondary-btn {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .primary-btn:active:not(:disabled), .secondary-btn:active { transform: scale(0.985); }

    .timer-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .timer-track {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--good), var(--accent-2));
      transition: width 0.05s linear;
    }
    .timer-bar.danger { background: linear-gradient(90deg, var(--bad), var(--warn)); }
    .timer-num {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 0.92rem;
      min-width: 48px;
      text-align: right;
    }
    .prompt-mini {
      text-align: center;
      font-size: 0.83rem;
      font-weight: 700;
      color: #dbe7ff;
      margin: 0;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .target-top {
      display: flex;
      justify-content: center;
      width: 100%;
    }
    .target-card {
      width: 44%;
      max-width: 175px;
      background: var(--card);
      border: 2px solid var(--accent-2);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 3 / 3.8;
    }
    .card-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(11, 16, 32, 0.85);
      color: #fff;
      font-weight: 800;
      font-size: 0.73rem;
      padding: 2px 7px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 3;
    }
    .target-card .card-tag {
      background: var(--accent-2);
      color: #061224;
      border: none;
    }
    .choices-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      width: 100%;
    }
    .choices-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-width: 365px;
      width: 100%;
      margin: 0 auto;
    }
    .face-card {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      aspect-ratio: 3 / 3.85;
      transition: transform 0.08s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .face-card img, .target-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .face-card.selected {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.35);
    }
    .face-card.correct {
      border-color: var(--good);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.4);
    }
    .face-card.wrong {
      border-color: var(--bad);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.4);
    }

    /* Composite card wrapper + interactive tap zones */
    .composite-wrap {
      position: relative;
      display: inline-block;
      max-width: 385px;
      width: auto;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: var(--card);
    }
    .composite-wrap img {
      display: block;
      max-width: 100%;
      max-height: 55dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .comp-grid-4 {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .comp-grid-3 {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 43%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    .comp-zone {
      cursor: pointer;
      border: 3px solid transparent;
      transition: border-color 0.12s ease, background-color 0.12s ease;
    }
    .comp-zone.selected {
      border-color: var(--accent-2);
      background: rgba(56, 189, 248, 0.16);
    }
    .comp-zone.correct {
      border-color: var(--good);
      background: rgba(34, 197, 94, 0.16);
    }
    .comp-zone.wrong {
      border-color: var(--bad);
      background: rgba(239, 68, 68, 0.18);
    }

    .thumb-bar {
      display: grid;
      gap: 7px;
    }
    .thumb-bar.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .thumb-bar.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .thumb-btn {
      background: var(--card-2);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-weight: 800;
      font-size: 0.95rem;
      padding: 10px 0;
      border-radius: 12px;
      cursor: pointer;
    }
    .thumb-btn.selected {
      background: var(--accent);
      border-color: var(--accent-2);
      color: #fff;
    }

    .explain-box {
      background: rgba(21, 29, 51, 0.95);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.8rem;
      line-height: 1.42;
    }
    .verdict-line {
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .verdict-good { color: var(--good); }
    .verdict-bad { color: var(--bad); }
    .explain-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .explain-actions.has-bio {
      grid-template-columns: 1fr 1.2fr;
    }
    .bio-btn {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #7dd3fc;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 10px 8px;
      cursor: pointer;
    }
    .bio-btn.active {
      background: var(--accent-2);
      color: #061224;
    }

    .score-big {
      font-size: 2.2rem;
      font-weight: 900;
      text-align: center;
      margin: 2px 0;
      background: linear-gradient(135deg, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0;
    }
    .stat-tile {
      background: var(--card-2);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
    }
    .stat-tile span { display: block; font-size: 0.72rem; color: var(--muted); }
    .stat-tile strong { font-size: 1rem; }

    .breakdown-wrap {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .breakdown-wrap.show { display: flex; }
    .bd-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
    }
    .bd-label { width: 105px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bd-track { flex: 1; height: 7px; background: rgba(255,255,255,0.09); border-radius: 999px; overflow: hidden; }
    .bd-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius: 999px; }
    .bd-val { width: 82px; text-align: right; font-variant-numeric: tabular-nums; color: #dbe7ff; font-weight: 700; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 8px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 50;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand" onclick="goHome()">
        <span class="brand-badge">FFA</span>
        <span class="brand-title">Cross-Race Quiz</span>
      </div>
      <div class="top-controls">
        <button class="icon-btn" id="btn-top-link" onclick="shareGameLink()" title="Share URL">🔗 URL</button>
        <div class="lang-toggle">
          <button class="lang-btn" id="btn-de" onclick="setLang('de')">DE</button>
          <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
          <button class="lang-btn" id="btn-ko" onclick="setLang('ko')">KO</button>
        </div>
      </div>
    </div>

    <!-- HOME SCREEN -->
    <div class="screen active" id="screen-home">
      <div class="hero-card">
        <h1 class="hero-title" id="t-hero-title"></h1>
        <p class="hero-sub" id="t-hero-sub"></p>
        <div class="science-note" id="t-science-note"></div>
      </div>

      <div>
        <div class="section-label" id="t-speed-label"></div>
        <div class="speed-row">
          <button class="speed-btn active" id="speed-normal" onclick="setSpeed(6.0)">
            <strong>⏱️ Normal (6.0s)</strong>
            <span id="t-speed-normal-desc"></span>
          </button>
          <button class="speed-btn" id="speed-blitz" onclick="setSpeed(3.5)">
            <strong>⚡ Blitz (3.5s)</strong>
            <span id="t-speed-blitz-desc"></span>
          </button>
        </div>
      </div>

      <div>
        <div class="section-label" id="t-cat-label"></div>
        <div class="cat-grid">
          <button class="cat-btn" onclick="startGame('east')">
            <div class="cat-left">
              <span class="cat-icon">🌏</span>
              <div>
                <span class="cat-title" id="t-cat-east"></span>
                <span class="cat-desc" id="t-cat-east-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-east">5R</span>
          </button>
          <button class="cat-btn" onclick="startGame('black')">
            <div class="cat-left">
              <span class="cat-icon">🌍</span>
              <div>
                <span class="cat-title" id="t-cat-black"></span>
                <span class="cat-desc" id="t-cat-black-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-black">5R</span>
          </button>
          <button class="cat-btn" onclick="startGame('euro')">
            <div class="cat-left">
              <span class="cat-icon">🇪🇺</span>
              <div>
                <span class="cat-title" id="t-cat-euro"></span>
                <span class="cat-desc" id="t-cat-euro-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-euro">5R</span>
          </button>
          <button class="cat-btn" onclick="startGame('all')">
            <div class="cat-left">
              <span class="cat-icon">🎲</span>
              <div>
                <span class="cat-title" id="t-cat-all"></span>
                <span class="cat-desc" id="t-cat-all-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-all">15 Mix</span>
          </button>
        </div>
      </div>
    </div>

    <!-- BRIEFING SCREEN -->
    <div class="screen" id="screen-brief">
      <div class="hud">
        <button class="back-btn" id="btn-back-brief" onclick="goHome()"></button>
        <span id="brief-progress"></span>
        <span class="badge" id="brief-cat-badge"></span>
      </div>
      <div class="panel brief-box">
        <span class="brief-mode-tag" id="brief-mode-tag"></span>
        <h2 class="brief-title" id="brief-title"></h2>
        <p class="brief-text" id="brief-text"></p>
        <div class="preload-hint" id="brief-preload-status"></div>
      </div>
      <button class="primary-btn" id="btn-ready" onclick="revealPhotos()"></button>
    </div>

    <!-- PLAY / REVIEW SCREEN -->
    <div class="screen" id="screen-play">
      <div>
        <div class="hud" style="margin-bottom:5px;">
          <button class="back-btn" id="btn-back-play" onclick="goHome()"></button>
          <span id="play-progress"></span>
          <span id="play-score"></span>

// ==================== IMAGE PRELOADER & PAINT GATE ====================
const IMG_CACHE = new Map(); // url -> Promise<HTMLImageElement>
const LOADED_SET = new Set(); // urls already decoded in memory

function getRoundUrls(r) {
  if (!r) return [];
  if (r.compositeImg) return [r.compositeImg];
  const urls = [];
  if (r.target && r.target.img) urls.push(r.target.img);
  if (r.cards) {
    Object.values(r.cards).forEach(c => {
      if (c && c.img) urls.push(c.img);
    });
  }
  return urls;
}

function preloadUrl(url) {
  if (IMG_CACHE.has(url)) return IMG_CACHE.get(url);
  const p = new Promise((resolve) => {
    const img = new Image();
    img.decoding = "async";
    let done = false;
    const finish = (ok, el) => {
      if (done) return;
      done = true;
      if (ok) LOADED_SET.add(url);
      else IMG_CACHE.delete(url);
      resolve(el || img);
    };
    const timeout = setTimeout(() => finish(false, img), 12000);
    img.onload = () => {
      clearTimeout(timeout);
      if (img.decode) {
        img.decode().then(() => finish(true, img)).catch(() => finish(true, img));
      } else {
        finish(true, img);
      }
    };
    img.onerror = () => {
      clearTimeout(timeout);
      const retry = new Image();
      retry.decoding = "async";
      const t2 = setTimeout(() => finish(false, retry), 10000);
      retry.onload = () => {
        clearTimeout(t2);
        if (retry.decode) {
          retry.decode().then(() => finish(true, retry)).catch(() => finish(true, retry));
        } else {
          finish(true, retry);
        }
      };
      retry.onerror = () => {
        clearTimeout(t2);
        finish(false, retry);
      };
      retry.src = url + (url.includes("?") ? "&" : "?") + "retry=1";
    };
    img.src = url;
  });
  IMG_CACHE.set(url, p);
  return p;
}

async function preloadRound(r, onProgress) {
  const urls = getRoundUrls(r);
  if (!urls.length) return;
  let completed = 0;
  if (onProgress) onProgress(0, urls.length);
  await Promise.all(urls.map(u => preloadUrl(u).then(() => {
    completed++;
    if (onProgress) onProgress(completed, urls.length);
  })));
}

function isRoundReadyInMemory(r) {
  const urls = getRoundUrls(r);
  return urls.every(u => LOADED_SET.has(u));
}

let bgQueueRunning = false;
async function warmDeckInBackground(roundsList) {
  if (bgQueueRunning) return;
  bgQueueRunning = true;
  try {
    for (const r of roundsList) {
      if (!isRoundReadyInMemory(r)) {
        await preloadRound(r);
      }
    }
  } finally {
    bgQueueRunning = false;
  }
}

// Wait for live DOM <img> elements inside #stage to be 100% decoded & painted on screen
async function waitForStagePaint() {
  const imgs = Array.from(document.querySelectorAll("#stage img"));
  await Promise.all(imgs.map(img => new Promise(res => {
    if (img.complete && img.naturalWidth > 0) {
      if (img.decode) img.decode().then(res).catch(res);
      else res();
      return;
    }
    const done = () => res();
    img.addEventListener("load", done, { once: true });
    img.addEventListener("error", done, { once: true });
    setTimeout(done, 4000);
  })));
  await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
}

  try {
    const q = new URLSearchParams(window.location.search).get("lang");
    if (q && UI[q]) return q;
    const nav = (navigator.language || "").toLowerCase();
    if (nav.startsWith("ko")) return "ko";
    if (nav.startsWith("de")) return "de";
  } catch (e) {}
  return "en";
}

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareRoundInstance(raw) {
  if (raw.compositeImg) {
    const cleanExplain = {};
    ["de", "en", "ko"].forEach(l => {
      cleanExplain[l] = raw.explain[l].replace(/\[\[([ABCD])\]\]/g, "$1");
    });
    return { ...raw, explain: cleanExplain };
  }
  const origKeys = raw.type === "target3" ? ["A", "B", "C"] : ["A", "B", "C", "D"];
  const shuffledOrig = shuffleArr(origKeys);
  const slotOf = {};
  const newCards = {};
  origKeys.forEach((dispKey, i) => {
    const oKey = shuffledOrig[i];
    slotOf[oKey] = dispKey;
    newCards[dispKey] = raw.cards[oKey];
  });
  const newAns = raw.answer.split("").map(ch => slotOf[ch]).sort().join("");
  const newExplain = {};
  ["de", "en", "ko"].forEach(l => {
    newExplain[l] = raw.explain[l].replace(/\[\[([ABCD])\]\]/g, (_, k) => slotOf[k]);
  });
  return {
    ...raw,
    cards: newCards,
    answer: newAns,
    explain: newExplain
  };
}

function catName(cat) {
  const t = UI[lang];
  if (cat === "east") return "🌏 " + t.catEast;
  if (cat === "black") return "🌍 " + t.catBlack;
  if (cat === "euro") return "🇪🇺 " + t.catEuro;
  return "🎲 " + t.catAll;
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function setLang(l) {
  if (!UI[l]) return;
  lang = l;
  document.documentElement.lang = l;
  ["de", "en", "ko"].forEach(code => {
    document.getElementById("btn-" + code).classList.toggle("active", code === l);
  });
  renderStaticText();
  if (phase === "brief" || phase === "loading") renderBrief();
  else if (phase === "play" || phase === "review") renderPlayOrReview();
  else if (phase === "result") renderResult();
}

function setSpeed(s) {
  speedSec = s;
  document.getElementById("speed-normal").classList.toggle("active", s === 6.0);
  document.getElementById("speed-blitz").classList.toggle("active", s === 3.5);
}

function renderStaticText() {
  const t = UI[lang];
  document.getElementById("btn-back-brief").textContent = t.backBtn;
  document.getElementById("btn-back-play").textContent = t.backBtn;
  document.getElementById("t-hero-title").textContent = t.heroTitle;
  document.getElementById("t-hero-sub").textContent = t.heroSub;
  document.getElementById("t-science-note").innerHTML = t.scienceNote;
  document.getElementById("t-speed-label").textContent = t.speedLabel;
  document.getElementById("t-speed-normal-desc").textContent = t.speedNormalDesc;
  document.getElementById("t-speed-blitz-desc").textContent = t.speedBlitzDesc;
  document.getElementById("t-cat-label").textContent = t.catLabel;
  document.getElementById("t-cat-east").textContent = t.catEast;
  document.getElementById("t-cat-east-desc").textContent = t.catEastDesc;
  document.getElementById("t-cat-black").textContent = t.catBlack;
  document.getElementById("t-cat-black-desc").textContent = t.catBlackDesc;
  document.getElementById("t-cat-euro").textContent = t.catEuro;
  document.getElementById("t-cat-euro-desc").textContent = t.catEuroDesc;
  document.getElementById("t-cat-all").textContent = t.catAll;
  document.getElementById("t-cat-all-desc").textContent = t.catAllDesc;

  const sTxt = `5 ${t.unitRounds}`;
  document.getElementById("pill-east").textContent = sTxt;
  document.getElementById("pill-black").textContent = sTxt;
  document.getElementById("pill-euro").textContent = sTxt;
  document.getElementById("pill-all").textContent = `15 ${t.unitMix}`;
}

function goHome() {
  roundSeq++;
  stopTimer();
  phase = "home";
  showScreen("screen-home");
}

function startGame(cat) {
  activeCat = cat;
  const rawPool = cat === "all" ? ROUNDS : ROUNDS.filter(r => r.cat === cat);
  // Strict deduplication guard by round id and primary image asset
  const seenIds = new Set();
  const seenPrimaryImg = new Set();
  const uniquePool = [];
  for (const r of rawPool) {
    const primaryImg = r.compositeImg || (r.target && r.target.img) || (r.cards && r.cards.A && r.cards.A.img);
    if (seenIds.has(r.id) || seenPrimaryImg.has(primaryImg)) continue;
    seenIds.add(r.id);
    seenPrimaryImg.add(primaryImg);
    uniquePool.push(r);
  }
  deck = shuffleArr(uniquePool).map(prepareRoundInstance);
  idx = 0;
  score = 0;
  historyLog = [];
  openBrief();
  // Kick off background deck preloading immediately
  warmDeckInBackground(deck);
}

function openBrief() {
  roundSeq++;
  const mySeq = roundSeq;
  stopTimer();
  phase = "brief";
  picked = [];
  bioOn = false;
  lastVerdict = null;
  renderBrief();
  showScreen("screen-brief");

  const r = deck[idx];
  const hintEl = document.getElementById("brief-preload-status");
  if (isRoundReadyInMemory(r)) {
    hintEl.textContent = UI[lang].preloadedHint;
    if (idx + 1 < deck.length) preloadRound(deck[idx + 1]);
  } else {
    hintEl.textContent = UI[lang].preloadingHint;
    preloadRound(r).then(() => {
      if (mySeq !== roundSeq) return;
      if (phase === "brief") {
        hintEl.textContent = UI[lang].preloadedHint;
      }
      if (idx + 1 < deck.length) preloadRound(deck[idx + 1]);
    });
  }
}

function renderBrief() {
  const t = UI[lang];
  const r = deck[idx];
  document.getElementById("brief-progress").textContent = `${t.roundWord} ${idx + 1} / ${deck.length}`;
  document.getElementById("brief-cat-badge").textContent = catName(r.cat);
  document.getElementById("brief-mode-tag").textContent =
    r.type === "target3" ? t.modeTarget3 : r.type === "pair4" ? t.modePair4 : t.modePsy4;
  document.getElementById("brief-title").textContent = r.title[lang];
  document.getElementById("brief-text").textContent = r.brief[lang];

  const btn = document.getElementById("btn-ready");
  if (phase === "loading") {
    btn.disabled = true;
  } else {
    btn.disabled = false;
    btn.textContent = t.readyBtn;
  }
  const hintEl = document.getElementById("brief-preload-status");
  hintEl.textContent = isRoundReadyInMemory(r) ? t.preloadedHint : t.preloadingHint;
}

async function revealPhotos() {
  if (phase !== "brief") return;
  const mySeq = ++roundSeq;
  const t = UI[lang];
  const r = deck[idx];
  const btn = document.getElementById("btn-ready");

  // 1. Ensure 100% of current round images are downloaded & decoded BEFORE leaving brief screen
  if (!isRoundReadyInMemory(r)) {
    phase = "loading";
    btn.disabled = true;
    await preloadRound(r, (done, total) => {
      if (mySeq === roundSeq) {
        btn.textContent = `${t.loadingBtn} (${done}/${total})…`;
      }
    });
    if (mySeq !== roundSeq) return;
  }

  // 2. Render photos into #stage with timer frozen at 100% (NOT counting down yet!)
  stopTimer();
  phase = "loading";
  picked = [];
  bioOn = false;

  const bar = document.getElementById("timer-bar");
  const num = document.getElementById("timer-num");
  bar.style.width = "100%";
  bar.classList.remove("danger");
  num.textContent = speedSec.toFixed(1) + "s";

  showScreen("screen-play");
  renderPlayOrReview();

  // 3. Wait until live DOM <img> elements are decoded AND painted on screen (2x rAF)
  await waitForStagePaint();
  if (mySeq !== roundSeq) return;

  // 4. NOW start play phase & timer!
  phase = "play";
  startTs = performance.now();
  timerId = setInterval(() => {
    const elapsed = (performance.now() - startTs) / 1000;
    const left = Math.max(0, speedSec - elapsed);
    const pct = (left / speedSec) * 100;
    bar.style.width = pct + "%";
    if (left <= 1.8) bar.classList.add("danger");
    num.textContent = left.toFixed(1) + "s";
    if (left <= 0) {
      stopTimer();
      finishRound("timeout");
    }
  }, 50);

  // Preload next round silently while user plays
  if (idx + 1 < deck.length) {
    preloadRound(deck[idx + 1]);
  }
}

function stopTimer() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
  }
}

// Zero-flicker class toggle for pair4 first tap (avoids rebuilding stage DOM!)
function syncPairSelectionUI() {
  document.querySelectorAll("[data-choice-card]").forEach(el => {
    const k = el.getAttribute("data-choice-card");
    el.classList.toggle("selected", picked.includes(k));
  });
  document.querySelectorAll("[data-choice-btn]").forEach(el => {
    const k = el.getAttribute("data-choice-btn");
    el.classList.toggle("selected", picked.includes(k));
  });
}

function tapChoice(key) {
  if (phase !== "play") return;
  const r = deck[idx];
  if (r.type === "pair4") {
    if (picked.includes(key)) {
      picked = picked.filter(k => k !== key);
    } else if (picked.length < 2) {
      picked.push(key);
    }
    if (picked.length === 2) {
      stopTimer();
      const sorted = [...picked].sort().join("");
      finishRound(sorted === r.answer ? "correct" : "wrong");
      return;
    }
    syncPairSelectionUI();
  } else {
    picked = [key];
    stopTimer();
    finishRound(key === r.answer ? "correct" : "wrong");
  }
}

function finishRound(verdict) {
  const elapsed = Math.min(speedSec, (performance.now() - startTs) / 1000);
  const isOk = verdict === "correct";
  if (isOk) score++;
  historyLog.push({ cat: deck[idx].cat, correct: isOk, elapsed });
  lastVerdict = verdict;
  phase = "review";
  renderPlayOrReview();
}

function toggleBio() {
  bioOn = !bioOn;
  renderPlayOrReview();
}

function renderPortraitCard(p, showBio, bioMatch) {
  const col = bioMatch ? "#38bdf8" : "#f87171";
  const bioOverlay = showBio
    ? `<svg viewBox="0 0 200 225" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;">
        <rect x="34" y="26" width="132" height="158" rx="22" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="6 4"/>
        <line x1="65" y1="94" x2="135" y2="94" stroke="${col}" stroke-width="1.6" stroke-dasharray="3 2"/>
        <polygon points="72,94 128,94 100,130 100,168" fill="rgba(56,189,248,0.08)" stroke="${col}" stroke-width="1.4"/>
      </svg>`
    : "";
  return `<div style="position:relative;width:100%;height:100%;">
    <img src="${p.img}" alt="" decoding="async" />
    ${bioOverlay}
  </div>`;
}

function renderPlayOrReview() {
  const t = UI[lang];
  const r = deck[idx];
  document.getElementById("play-progress").textContent = `${t.roundWord} ${idx + 1}/${deck.length}`;
  document.getElementById("play-score").textContent = `${t.pointsWord}: ${score}`;
  document.getElementById("play-prompt").textContent = r.prompt[lang];

  const keys = r.type === "target3" ? ["A", "B", "C"] : ["A", "B", "C", "D"];
  const ansChars = r.answer.split("");
  const stage = document.getElementById("stage");
  let html = "";

  if (r.compositeImg) {
    const gridCls = r.type === "target3" ? "comp-grid-3" : "comp-grid-4";
    let zones = "";
    keys.forEach(k => {
      let zCls = "comp-zone";
      const isAns = ansChars.includes(k);
      const isPicked = picked.includes(k);
      if ((phase === "play" || phase === "loading") && isPicked) zCls += " selected";
      if (phase === "review") {
        if (isAns) zCls += " correct";
        else if (isPicked) zCls += " wrong";
      }
      zones += `<div class="${zCls}" data-choice-card="${k}" onclick="tapChoice('${k}')"></div>`;
    });
    html = `<div class="composite-wrap">
      <img src="${r.compositeImg}" alt="" decoding="async" />
      <div class="${gridCls}">${zones}</div>
    </div>`;
  } else {
    if (r.type === "target3") {
      html += `<div class="target-top">
        <div class="target-card">
          <span class="card-tag">TARGET</span>
          ${renderPortraitCard(r.target, phase === "review" && bioOn, true)}
        </div>
      </div>`;
    }
    html += `<div class="${r.type === 'target3' ? 'choices-3' : 'choices-4'}">`;
    keys.forEach(k => {
      let cls = "face-card";
      const isAns = ansChars.includes(k);
      const isPicked = picked.includes(k);
      if ((phase === "play" || phase === "loading") && isPicked) cls += " selected";
      if (phase === "review") {
        if (isAns) cls += " correct";
        else if (isPicked) cls += " wrong";
      }
      const showCardBio = phase === "review" && bioOn && (isAns || isPicked);
      html += `<div class="${cls}" data-choice-card="${k}" onclick="tapChoice('${k}')">
        <span class="card-tag">${k}</span>
        ${renderPortraitCard(r.cards[k], showCardBio, isAns)}
      </div>`;
    });
    html += `</div>`;
  }
  stage.innerHTML = html;

  const bottom = document.getElementById("bottom-controls");
  if (phase === "play" || phase === "loading") {
    let btns = `<div class="thumb-bar ${keys.length === 3 ? 'cols-3' : 'cols-4'}">`;
    keys.forEach(k => {
      const sel = picked.includes(k) ? "selected" : "";
      btns += `<button class="thumb-btn ${sel}" data-choice-btn="${k}" onclick="tapChoice('${k}')">${k}</button>`;
    });
    btns += `</div>`;
    bottom.innerHTML = btns;
  } else {
    const vText = lastVerdict === "correct" ? t.correctMsg : lastVerdict === "timeout" ? t.timeoutMsg : t.wrongMsg;
    const vCls = lastVerdict === "correct" ? "verdict-good" : "verdict-bad";
    const nextLbl = idx + 1 < deck.length ? t.nextBtn : t.finishBtn;
    const showBioBtn = !r.compositeImg;
    bottom.innerHTML = `<div class="explain-box">
      <div class="verdict-line ${vCls}">${vText}</div>
      <div style="color:#d6e0f8;margin-bottom:8px;">${r.explain[lang]}</div>
      <div class="explain-actions ${showBioBtn ? 'has-bio' : ''}">
        ${showBioBtn ? `<button class="bio-btn ${bioOn ? 'active' : ''}" onclick="toggleBio()">${t.bioBtn}</button>` : ""}
        <button class="primary-btn" style="padding:10px 12px;font-size:0.86rem;" onclick="nextRound()">${nextLbl}</button>
      </div>
    </div>`;
  }
}

function nextRound() {
  if (idx + 1 < deck.length) {
    idx++;
    openBrief();
  } else {
    phase = "result";
    renderResult();
    showScreen("screen-result");
  }
}

function renderResult() {
  const t = UI[lang];
  const pct = Math.round((score / deck.length) * 100);
  const avg = historyLog.length ? (historyLog.reduce((a, b) => a + b.elapsed, 0) / historyLog.length).toFixed(2) : "0.00";
  let rIdx = pct >= 85 ? 0 : pct >= 60 ? 1 : pct >= 35 ? 2 : 3;

  document.getElementById("res-cat-badge").textContent = catName(activeCat);
  document.getElementById("res-score").textContent = `${score} / ${deck.length}`;
  document.getElementById("res-rank").textContent = t.ranks[rIdx];
  document.getElementById("t-stat-acc").textContent = t.statAcc;
  document.getElementById("t-stat-time").textContent = t.statTime;
  document.getElementById("res-acc").textContent = `${pct}%`;
  document.getElementById("res-time").textContent = `${avg}s`;
  document.getElementById("res-science").innerHTML = t.resScience;
  document.getElementById("btn-share").textContent = t.shareBtn;
  document.getElementById("btn-switch-cat").textContent = t.switchCatBtn;

  const bdEl = document.getElementById("res-breakdown");
  if (activeCat === "all") {
    const groups = [
      { key: "east", label: t.shortEast },
      { key: "black", label: t.shortBlack },
      { key: "euro", label: t.shortEuro }
    ];
    let bdHtml = "";
    groups.forEach(g => {
      const items = historyLog.filter(x => x.cat === g.key);
      if (!items.length) return;
      const hits = items.filter(x => x.correct).length;
      const gPct = Math.round((hits / items.length) * 100);
      const gAvg = (items.reduce((a, b) => a + b.elapsed, 0) / items.length).toFixed(1);
      bdHtml += `<div class="bd-row">
        <span class="bd-label">${g.label}</span>
        <div class="bd-track"><div class="bd-fill" style="width:${gPct}%;"></div></div>
        <span class="bd-val">${hits}/${items.length} (${gAvg}s)</span>
      </div>`;
    });
    bdEl.innerHTML = bdHtml;
    bdEl.classList.add("show");
  } else {
    bdEl.innerHTML = "";
    bdEl.classList.remove("show");
  }
}

function getCleanShareUrl() {
  try {
    if (window.location.protocol.startsWith("http")) {
      return window.location.origin + window.location.pathname;
    }
  } catch (e) {}
  return "https://kaao7628-del.github.io/cross-race-challenge/";
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

async function shareGameLink() {
  const t = UI[lang];
  const url = getCleanShareUrl();
  if (navigator.share) {
    try {
      await navigator.share({ title: t.heroTitle, url });
      return;
    } catch (e) {}
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(url);
  }
  showToast(t.linkCopied);
}

async function copyShare() {
  const t = UI[lang];
  const avg = historyLog.length ? (historyLog.reduce((a, b) => a + b.elapsed, 0) / historyLog.length).toFixed(2) : "0.00";
  const modeStr = speedSec === 3.5 ? "Blitz 3.5s ⚡" : "Normal 6.0s ⏱️";
  const url = getCleanShareUrl();
  let msg = "";
  if (lang === "de") {
    msg = `🧠 Cross-Race-Effekt Challenge (${catName(activeCat)} | ${modeStr})\nTreffer: ${score}/${deck.length} (Ø ${avg}s)\nSchaffst du mehr? Ohne Login direkt spielen:\n${url}`;
  } else if (lang === "ko") {
    msg = `🧠 타인종 안면인식 스피드 테스트 (${catName(activeCat)} | ${modeStr})\n점수: ${score}/${deck.length} (평균 ${avg}초)\n로그인 없이 링크 클릭 후 바로 도전해 보세요!\n${url}`;
  } else {
    msg = `🧠 Cross-Race Effect Challenge (${catName(activeCat)} | ${modeStr})\nScore: ${score}/${deck.length} (Avg ${avg}s)\nPlay instantly (no login):\n${url}`;
  }

  if (navigator.share) {
    try {
      await navigator.share({ title: t.heroTitle, text: msg });
      return;
    } catch (e) {}
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(msg);
  }
  showToast(t.copied);
}

setLang(lang);
// Gently warm-cache images during idle time on the home screen
setTimeout(() => warmDeckInBackground(ROUNDS.slice(0, 6)), 350);
</script>
