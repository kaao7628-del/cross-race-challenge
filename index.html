<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Cross-Race Face Challenge | 안면인식 스피드 테스트</title>
  <meta name="description" content="로그인 없이 바로 플레이! 제한 시간 안에 머리스타일·안경 함정을 뚫고 진짜 이목구비를 구분할 수 있나요? (36라운드 · 동아시아/흑인/유럽 360° 테스트)" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="🧠 Cross-Race Face Challenge (36 Rounds)" />
  <meta property="og:description" content="머리스타일·수염·안경 함정을 뚫고 진짜 얼굴 골격을 찾아보세요! 로그인 없이 링크 클릭 즉시 플레이 가능." />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  <style>
    :root {
      --bg: #0b1020;
      --card: #151d33;
      --card-2: #1c2744;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f6ff;
      --muted: #9aa7c7;
      --accent: #4f8cff;
      --accent-2: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: radial-gradient(circle at 50% 0%, #172342 0%, var(--bg) 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard", "Malgun Gothic", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    .app {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 0 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: -0.02em;
      cursor: pointer;
      min-width: 0;
    }
    .brand-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-badge {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border-radius: 8px;
      padding: 3px 6px;
      font-size: 0.74rem;
      flex-shrink: 0;
    }
    .top-Controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .icon-btn:active { transform: scale(0.95); }
    .lang-toggle {
      display: inline-flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 7px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .screen {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .screen.active { display: flex; }

    .hero-card, .panel {
      background: rgba(21, 29, 51, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 13px 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    .hero-title {
      font-size: 1.22rem;
      font-weight: 800;
      margin: 0 0 5px;
      line-height: 1.24;
    }
    .hero-sub {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.44;
      margin: 0;
    }
    .science-note {
      margin-top: 9px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(79, 140, 255, 0.11);
      border: 1px solid rgba(79, 140, 255, 0.28);
      font-size: 0.76rem;
      line-height: 1.42;
      color: #dbe7ff;
    }
    .section-label {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 700;
      margin: 2px 0 5px;
    }
    .speed-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .len-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    .speed-btn, .len-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
    }
    .len-btn {
      text-align: center;
      padding: 7px 6px;
    }
    .speed-btn.active, .len-btn.active {
      border-color: var(--accent-2);
      background: rgba(56, 189, 248, 0.14);
    }
    .speed-btn strong { display: block; font-size: 0.84rem; }
    .speed-btn span { font-size: 0.71rem; color: var(--muted); }
    .len-btn strong { display: block; font-size: 0.79rem; }
    .len-btn span { font-size: 0.68rem; color: var(--muted); }

    .cat-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }
    .cat-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(135deg, var(--card), var(--card-2));
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 15px;
      padding: 11px 13px;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease;
      text-align: left;
    }
    .cat-btn:active { transform: scale(0.985); }
    .cat-btn:hover { border-color: var(--accent); }
    .cat-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .cat-icon { font-size: 1.4rem; flex-shrink: 0; }
    .cat-title { font-weight: 800; font-size: 0.91rem; display: block; }
    .cat-desc { font-size: 0.73rem; color: var(--muted); display: block; margin-top: 2px; line-height: 1.3; }
    .cat-pill {
      background: rgba(255,255,255,0.08);
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent-2);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 700;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(79, 140, 255, 0.16);
      color: #bcd5ff;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .brief-box {
      text-align: center;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .brief-mode-tag {
      background: rgba(245, 158, 11, 0.16);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .brief-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0;
      line-height: 1.3;
    }
    .brief-text {
      font-size: 0.89rem;
      color: #d6e0f8;
      line-height: 1.48;
      margin: 0;
    }
    .primary-btn, .secondary-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease;
    }
    .primary-btn {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
    }
    .secondary-btn {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .primary-btn:active, .secondary-btn:active { transform: scale(0.985); }

    .timer-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .timer-track {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--good), var(--accent-2));
      transition: width 0.05s linear;
    }
    .timer-bar.danger { background: linear-gradient(90deg, var(--bad), var(--warn)); }
    .timer-num {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 0.92rem;
      min-width: 44px;
      text-align: right;
    }
    .prompt-mini {
      text-align: center;
      font-size: 0.83rem;
      font-weight: 700;
      color: #dbe7ff;
      margin: 0;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }
    .target-top {
      display: flex;
      justify-content: center;
    }
    .target-card {
      width: 44%;
      max-width: 175px;
      background: var(--card);
      border: 2px solid var(--accent-2);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 4 / 4.5;
    }
    .card-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(11, 16, 32, 0.82);
      color: #fff;
      font-weight: 800;
      font-size: 0.73rem;
      padding: 2px 7px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.18);
      z-index: 2;
    }
    .target-card .card-tag {
      background: var(--accent-2);
      color: #061224;
      border: none;
    }
    .choices-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .choices-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-width: 370px;
      width: 100%;
      margin: 0 auto;
    }
    .face-card {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      aspect-ratio: 4 / 4.6;
      transition: transform 0.08s ease, border-color 0.12s ease;
    }
    .face-card svg, .target-card svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .face-card.selected {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.32);
    }
    .face-card.correct {
      border-color: var(--good);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.35);
    }
    .face-card.wrong {
      border-color: var(--bad);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.35);
    }

    .thumb-bar {
      display: grid;
      gap: 7px;
    }
    .thumb-bar.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .thumb-bar.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .thumb-btn {
      background: var(--card-2);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-weight: 800;
      font-size: 0.95rem;
      padding: 10px 0;
      border-radius: 12px;
      cursor: pointer;
    }
    .thumb-btn.selected {
      background: var(--accent);
      border-color: var(--accent-2);
      color: #fff;
    }

    .explain-box {
      background: rgba(21, 29, 51, 0.95);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.8rem;
      line-height: 1.42;
    }
    .verdict-line {
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .verdict-good { color: var(--good); }
    .verdict-bad { color: var(--bad); }
    .explain-actions {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 8px;
    }
    .bio-btn {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #7dd3fc;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 10px 8px;
      cursor: pointer;
    }
    .bio-btn.active {
      background: var(--accent-2);
      color: #061224;
    }

    .score-big {
      font-size: 2.2rem;
      font-weight: 900;
      text-align: center;
      margin: 2px 0;
      background: linear-gradient(135deg, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0;
    }
    .stat-tile {
      background: var(--card-2);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
    }
    .stat-tile span { display: block; font-size: 0.72rem; color: var(--muted); }
    .stat-tile strong { font-size: 1rem; }

    .breakdown-wrap {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .breakdown-wrap.show { display: flex; }
    .bd-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
    }
    .bd-label { width: 105px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bd-track { flex: 1; height: 7px; background: rgba(255,255,255,0.09); border-radius: 999px; overflow: hidden; }
    .bd-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius: 999px; }
    .bd-val { width: 82px; text-align: right; font-variant-numeric: tabular-nums; color: #dbe7ff; font-weight: 700; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 8px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 50;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand" onclick="goHome()">
        <span class="brand-badge">FFA</span>
        <span class="brand-title">Cross-Race Quiz</span>
      </div>
      <div class="top-Controls">
        <button class="icon-btn" id="btn-top-link" onclick="shareGameLink()" title="Share URL">🔗 URL</button>
        <div class="lang-toggle">
          <button class="lang-btn" id="btn-de" onclick="setLang('de')">DE</button>
          <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
          <button class="lang-btn" id="btn-ko" onclick="setLang('ko')">KO</button>
        </div>
      </div>
    </div>

    <!-- HOME SCREEN -->
    <div class="screen active" id="screen-home">
      <div class="hero-card">
        <h1 class="hero-title" id="t-hero-title"></h1>
        <p class="hero-sub" id="t-hero-sub"></p>
        <div class="science-note" id="t-science-note"></div>
      </div>

      <div>
        <div class="section-label" id="t-speed-label"></div>
        <div class="speed-row">
          <button class="speed-btn active" id="speed-normal" onclick="setSpeed(6.0)">
            <strong>⏱️ Normal (6.0s)</strong>
            <span id="t-speed-normal-desc"></span>
          </button>
          <button class="speed-btn" id="speed-blitz" onclick="setSpeed(3.5)">
            <strong>⚡ Blitz (3.5s)</strong>
            <span id="t-speed-blitz-desc"></span>
          </button>
        </div>
        <div class="len-row" style="display:none;">
          <button class="len-btn" id="len-quick" onclick="setLenMode('quick')">
            <strong id="t-len-quick"></strong>
            <span id="t-len-quick-sub"></span>
          </button>
          <button class="len-btn active" id="len-std" onclick="setLenMode('std')">
            <strong id="t-len-std"></strong>
            <span id="t-len-std-sub"></span>
          </button>
          <button class="len-btn" id="len-full" onclick="setLenMode('full')">
            <strong id="t-len-full"></strong>
            <span id="t-len-full-sub"></span>
          </button>
        </div>
      </div>

      <div>
        <div class="section-label" id="t-cat-label"></div>
        <div class="cat-grid">
          <button class="cat-btn" onclick="startGame('east')">
            <div class="cat-left">
              <span class="cat-icon">🌏</span>
              <div>
                <span class="cat-title" id="t-cat-east"></span>
                <span class="cat-desc" id="t-cat-east-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-east">10R</span>
          </button>
          <button class="cat-btn" onclick="startGame('black')">
            <div class="cat-left">
              <span class="cat-icon">🌍</span>
              <div>
                <span class="cat-title" id="t-cat-black"></span>
                <span class="cat-desc" id="t-cat-black-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-black">10R</span>
          </button>
          <button class="cat-btn" onclick="startGame('euro')">
            <div class="cat-left">
              <span class="cat-icon">🇪🇺</span>
              <div>
                <span class="cat-title" id="t-cat-euro"></span>
                <span class="cat-desc" id="t-cat-euro-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-euro">10R</span>
          </button>
          <button class="cat-btn" onclick="startGame('all')">
            <div class="cat-left">
              <span class="cat-icon">🎲</span>
              <div>
                <span class="cat-title" id="t-cat-all"></span>
                <span class="cat-desc" id="t-cat-all-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-all">15 Mix</span>
          </button>
        </div>
      </div>
    </div>

    <!-- BRIEFING SCREEN -->
    <div class="screen" id="screen-brief">
      <div class="hud">
        <span id="brief-progress"></span>
        <span class="badge" id="brief-cat-badge"></span>
      </div>
      <div class="panel brief-box">
        <span class="brief-mode-tag" id="brief-mode-tag"></span>
        <h2 class="brief-title" id="brief-title"></h2>
        <p class="brief-text" id="brief-text"></p>
      </div>
      <button class="primary-btn" id="btn-ready" onclick="revealPhotos()"></button>
    </div>

    <!-- PLAY / REVIEW SCREEN -->
    <div class="screen" id="screen-play">
      <div>
        <div class="hud" style="margin-bottom:5px;">
          <span id="play-progress"></span>
          <span id="play-score"></span>
        </div>
        <div class="timer-wrap" id="timer-wrap">
          <div class="timer-track"><div class="timer-bar" id="timer-bar"></div></div>
          <div class="timer-num" id="timer-num">6.0s</div>
        </div>
      </div>

      <p class="prompt-mini" id="play-prompt"></p>

      <div class="stage" id="stage"></div>

      <div id="bottom-controls"></div>
    </div>

    <!-- RESULT SCREEN -->
    <div class="screen" id="screen-result">
      <div class="panel">
        <div class="badge" id="res-cat-badge" style="margin-bottom:6px;"></div>
        <div class="score-big" id="res-score"></div>
        <div style="text-align:center;font-weight:800;font-size:0.96rem;margin-bottom:6px;" id="res-rank"></div>
        <div class="stat-row">
          <div class="stat-tile">
            <span id="t-stat-acc"></span>
            <strong id="res-acc"></strong>
          </div>
          <div class="stat-tile">
            <span id="t-stat-time"></span>
            <strong id="res-time"></strong>
          </div>
        </div>
        <div class="breakdown-wrap" id="res-breakdown"></div>
        <div class="science-note" id="res-science"></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="primary-btn" id="btn-share" onclick="copyShare()"></button>
        <button class="secondary-btn" id="btn-switch-cat" onclick="goHome()"></button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const UI = {
  de: {

function detectInitialLang() {
  try {
    const q = new URLSearchParams(window.location.search).get("lang");
    if (q && UI[q]) return q;
    const nav = (navigator.language || "").toLowerCase();
    if (nav.startsWith("ko")) return "ko";
    if (nav.startsWith("de")) return "de";
  } catch (e) {}
  return "en";
}

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Permutes card slots A/B/C(/D) so answers can never be memorized, while remapping [[X]] tokens in explain!
function prepareRoundInstance(raw) {
  if (raw.compositeImg) {
    const cleanExplain = {};
    ["de", "en", "ko"].forEach(l => {
      cleanExplain[l] = raw.explain[l].replace(/\[\[([ABCD])\]\]/g, "$1");
    });
    return { ...raw, explain: cleanExplain };
  }
  const origKeys = raw.type === "target3" ? ["A", "B", "C"] : ["A", "B", "C", "D"];
  const shuffledOrig = shuffleArr(origKeys);
  const slotOf = {};
  const newCards = {};
  origKeys.forEach((dispKey, i) => {
    const oKey = shuffledOrig[i];
    slotOf[oKey] = dispKey;
    newCards[dispKey] = raw.cards[oKey];
  });
  const newAns = raw.answer.split("").map(ch => slotOf[ch]).sort().join("");
  const newExplain = {};
  ["de", "en", "ko"].forEach(l => {
    let txt = raw.explain[l];
    // For pair4, if [[X]] und/and/와 [[Y]] appears in reverse alphabetical order, keep letters clean:
    txt = txt.replace(/\[\[([ABCD])\]\]/g, (_, k) => slotOf[k]);
    newExplain[l] = txt;
  });
  return {
    ...raw,
    cards: newCards,
    answer: newAns,
    explain: newExplain
  };
}

function catName(cat) {
  const t = UI[lang];
  if (cat === "east") return "🌏 " + t.catEast;
  if (cat === "black") return "🌍 " + t.catBlack;
  if (cat === "euro") return "🇪🇺 " + t.catEuro;
  return "🎲 " + t.catAll;
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function setLang(l) {
  if (!UI[l]) return;
  lang = l;
  document.documentElement.lang = l;
  ["de", "en", "ko"].forEach(code => {
    document.getElementById("btn-" + code).classList.toggle("active", code === l);
  });
  renderStaticText();
  if (phase === "brief") renderBrief();
  else if (phase === "play" || phase === "review") renderPlayOrReview();
  else if (phase === "result") renderResult();
}

function setSpeed(s) {
  speedSec = s;
  document.getElementById("speed-normal").classList.toggle("active", s === 6.0);
  document.getElementById("speed-blitz").classList.toggle("active", s === 3.5);
}

function setLenMode(m) {
  lenMode = m;

function getCounts() {

}

function getPhotoRounds(cat) {
  const isPhoto = (r) => Boolean(r.compositeImg || Object.values(r.cards).every(c => c.img));
  return ROUNDS.filter(r => r.cat === cat && isPhoto(r));
}

function goHome() {
  stopTimer();
  phase = "home";
  showScreen("screen-home");
}

function startGame(cat) {
  activeCat = cat;
  let selected = [];
  if (cat === "all") {
    ["east", "black", "euro"].forEach(c => {
      selected.push(...getPhotoRounds(c));
    });
    selected = shuffleArr(selected);
  } else {
    selected = shuffleArr(getPhotoRounds(cat));
  }
  deck = selected.map(prepareRoundInstance);
  idx = 0;
  score = 0;
  historyLog = [];
  openBrief();
}

  stopTimer();
  phase = "brief";
  picked = [];

  lastVerdict = null;

}

  document.getElementById("brief-mode-tag").textContent =
    r.type === "target3" ? t.modeTarget3 : r.type === "pair4" ? t.modePair4 : t.modePsy4;
  document.getElementById("brief-title").textContent = r.title[lang];
  document.getElementById("brief-text").textContent = r.brief[lang];
  document.getElementById("btn-ready").textContent = t.readyBtn;
}

  showScreen("screen-play");

  startTs = performance.now();
  const bar = document.getElementById("timer-bar");
  const num = document.getElementById("timer-num");
  bar.style.width = "100%";
  bar.classList.remove("danger");
  num.textContent = speedSec.toFixed(1) + "s";

  stopTimer();
  timerId = setInterval(() => {
    const elapsed = (performance.now() - startTs) / 1000;
    const left = Math.max(0, speedSec - elapsed);
    const pct = (left / speedSec) * 100;
    bar.style.width = pct + "%";
    if (left <= 1.8) bar.classList.add("danger");
    num.textContent = left.toFixed(1) + "s";
    if (left <= 0) {
      stopTimer();
      finishRound("timeout");
    }
  }, 50);
}

function stopTimer() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
  }
}

function tapChoice(key) {
  if (phase !== "play") return;
  const r = deck[idx];
  if (r.type === "pair4") {
    if (picked.includes(key)) {
      picked = picked.filter(k => k !== key);
    } else if (picked.length < 2) {
      picked.push(key);
    }
    if (picked.length === 2) {
      stopTimer();
      const sorted = [...picked].sort().join("");
      finishRound(sorted === r.answer ? "correct" : "wrong");
      return;
    }
    renderPlayOrReview();
  } else {
    picked = [key];
    stopTimer();
    finishRound(key === r.answer ? "correct" : "wrong");
  }
}

function finishRound(verdict) {
  const elapsed = Math.min(speedSec, (performance.now() - startTs) / 1000);
  const isOk = verdict === "correct";
  if (isOk) score++;
  historyLog.push({ cat: deck[idx].cat, correct: isOk, elapsed });
  lastVerdict = verdict;
  phase = "review";
  renderPlayOrReview();
}

function toggleBio() {
  bioOn = !bioOn;
  renderPlayOrReview();
}

function renderPlayOrReview() {
  const t = UI[lang];
  const r = deck[idx];
  document.getElementById("play-progress").textContent = `${t.roundWord} ${idx + 1}/${deck.length}`;
  document.getElementById("play-score").textContent = `${t.pointsWord}: ${score}`;
  document.getElementById("play-prompt").textContent = r.prompt[lang];

  const keys = r.type === "target3" ? ["A", "B", "C"] : ["A", "B", "C", "D"];
  const ansChars = r.answer.split("");
  const stage = document.getElementById("stage");
  let html = "";

  if (r.compositeImg) {
    html = `<div style="display:flex;justify-content:center;align-items:center;width:100%;">
      <img src="${r.compositeImg}" alt="" loading="eager" style="width:100%;max-width:390px;max-height:54dvh;object-fit:contain;border-radius:14px;border:2px solid var(--border);display:block;" />
    </div>`;
  } else {
    if (r.type === "target3") {
    html += `<div class="target-top">
      <div class="target-card">
        <span class="card-tag">TARGET</span>
        ${renderPortraitSVG(r.target, phase === "review" && bioOn, true)}
      </div>
    </div>`;
  }

  html += `<div class="${r.type === 'target3' ? 'choices-3' : 'choices-4'}">`;
  keys.forEach(k => {
    let cls = "face-card";
    const isAns = ansChars.includes(k);
    const isPicked = picked.includes(k);
    if (phase === "play" && isPicked) cls += " selected";
    if (phase === "review") {
      if (isAns) cls += " correct";
      else if (isPicked) cls += " wrong";
    }
    const showCardBio = phase === "review" && bioOn && (isAns || isPicked);
    html += `<div class="${cls}" onclick="tapChoice('${k}')">
      <span class="card-tag">${k}</span>
      ${renderPortraitSVG(r.cards[k], showCardBio, isAns)}
    </div>`;
  });
  html += `</div>`;
  }
  stage.innerHTML = html;

  const bottom = document.getElementById("bottom-controls");
  if (phase === "play") {
    let btns = `<div class="thumb-bar ${keys.length === 3 ? 'cols-3' : 'cols-4'}">`;
    keys.forEach(k => {
      const sel = picked.includes(k) ? "selected" : "";
      btns += `<button class="thumb-btn ${sel}" onclick="tapChoice('${k}')">${k}</button>`;
    });
    btns += `</div>`;
    bottom.innerHTML = btns;
  } else {
    const vText = lastVerdict === "correct" ? t.correctMsg : lastVerdict === "timeout" ? t.timeoutMsg : t.wrongMsg;
    const vCls = lastVerdict === "correct" ? "verdict-good" : "verdict-bad";
    const nextLbl = idx + 1 < deck.length ? t.nextBtn : t.finishBtn;
    bottom.innerHTML = `<div class="explain-box">
      <div class="verdict-line ${vCls}">${vText}</div>
      <div style="color:#d6e0f8;margin-bottom:8px;">${r.explain[lang]}</div>
      <div class="explain-actions">
        <button class="bio-btn ${bioOn ? 'active' : ''}" onclick="toggleBio()">${t.bioBtn}</button>
        <button class="primary-btn" style="padding:10px 12px;font-size:0.86rem;" onclick="nextRound()">${nextLbl}</button>
      </div>
    </div>`;
  }
}

function nextRound() {
  if (idx + 1 < deck.length) {
    idx++;
    openBrief();
  } else {
    phase = "result";
    renderResult();
    showScreen("screen-result");
  }
}

function renderResult() {
  const t = UI[lang];
  const pct = Math.round((score / deck.length) * 100);
  const avg = historyLog.length ? (historyLog.reduce((a, b) => a + b.elapsed, 0) / historyLog.length).toFixed(2) : "0.00";
  let rIdx = pct >= 85 ? 0 : pct >= 60 ? 1 : pct >= 35 ? 2 : 3;

  document.getElementById("res-cat-badge").textContent = catName(activeCat);
  document.getElementById("res-score").textContent = `${score} / ${deck.length}`;
  document.getElementById("res-rank").textContent = t.ranks[rIdx];
  document.getElementById("t-stat-acc").textContent = t.statAcc;
  document.getElementById("t-stat-time").textContent = t.statTime;
  document.getElementById("res-acc").textContent = `${pct}%`;
  document.getElementById("res-time").textContent = `${avg}s`;
  document.getElementById("res-science").innerHTML = t.resScience;
  document.getElementById("btn-share").textContent = t.shareBtn;
  document.getElementById("btn-switch-cat").textContent = t.switchCatBtn;

  const bdEl = document.getElementById("res-breakdown");
  if (activeCat === "all") {
    const groups = [
      { key: "east", label: t.shortEast },
      { key: "black", label: t.shortBlack },
      { key: "euro", label: t.shortEuro }
    ];
    let bdHtml = "";
    groups.forEach(g => {
      const items = historyLog.filter(x => x.cat === g.key);
      if (!items.length) return;
      const hits = items.filter(x => x.correct).length;
      const gPct = Math.round((hits / items.length) * 100);
      const gAvg = (items.reduce((a, b) => a + b.elapsed, 0) / items.length).toFixed(1);
      bdHtml += `<div class="bd-row">
        <span class="bd-label">${g.label}</span>
        <div class="bd-track"><div class="bd-fill" style="width:${gPct}%;"></div></div>
        <span class="bd-val">${hits}/${items.length} (${gAvg}s)</span>
      </div>`;
    });
    bdEl.innerHTML = bdHtml;
    bdEl.classList.add("show");
  } else {
    bdEl.innerHTML = "";
    bdEl.classList.remove("show");
  }
}

function getCleanShareUrl() {
  try {
    if (window.location.protocol.startsWith("http")) {
      return window.location.origin + window.location.pathname;
    }
  } catch (e) {}
  return "https://kaao7628-del.github.io/cross-race-challenge/";
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

async function shareGameLink() {
  const t = UI[lang];
  const url = getCleanShareUrl();
  if (navigator.share) {
    try {
      await navigator.share({ title: t.heroTitle, url });
      return;
    } catch (e) {}
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(url);
  }
  showToast(t.linkCopied);
}

async function copyShare() {
  const t = UI[lang];
  const avg = historyLog.length ? (historyLog.reduce((a, b) => a + b.elapsed, 0) / historyLog.length).toFixed(2) : "0.00";
  const modeStr = speedSec === 3.5 ? "Blitz 3.5s ⚡" : "Normal 6.0s ⏱️";
  const url = getCleanShareUrl();
  let msg = "";
  if (lang === "de") {
    msg = `🧠 Cross-Race-Effekt Challenge (${catName(activeCat)} | ${modeStr})\nTreffer: ${score}/${deck.length} (Ø ${avg}s)\nSchaffst du mehr? Ohne Login direkt spielen:\n${url}`;
  } else if (lang === "ko") {
    msg = `🧠 타인종 안면인식 스피드 테스트 (${catName(activeCat)} | ${modeStr})\n점수: ${score}/${deck.length} (평균 ${avg}초)\n로그인 없이 링크 클릭 후 바로 도전해 보세요!\n${url}`;
  } else {
    msg = `🧠 Cross-Race Effect Challenge (${catName(activeCat)} | ${modeStr})\nScore: ${score}/${deck.length} (Avg ${avg}s)\nPlay instantly (no login):\n${url}`;
  }

  if (navigator.share) {
    try {
      await navigator.share({ title: t.heroTitle, text: msg });
      return;
    } catch (e) {}
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(msg);
  }
  showToast(t.copied);
}

setLang(lang);
</script>
