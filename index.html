<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Cross-Race Face Challenge | 하드코어 실사 안면인식 테스트</title>
  <meta name="description" content="노힌트 하드코어 에디션! 100% 실사 초박빙 도플갱어들 사이에서 골격만으로 동일 인물과 스파이를 색출해 보세요." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="🧠 Cross-Race 실사 안면인식 테스트 (Hardcore)" />
  <meta property="og:description" content="힌트 제로 · 도플갱어 함정! 제한 시간 안에 진짜 이목구비 골격만으로 정답을 찾아보세요." />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  <style>
    :root {
      --bg: #0b1020;
      --card: #151d33;
      --card-2: #1c2744;
      --border: rgba(255, 255, 255, 0.13);
      --text: #f3f6ff;
      --muted: #9aa7c7;
      --accent: #4f8cff;
      --accent-2: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: radial-gradient(circle at 50% 0%, #172342 0%, var(--bg) 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard", "Malgun Gothic", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    .app {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 8px 13px calc(12px + env(safe-area-inset-bottom));
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 2px 0 6px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.88rem;
      letter-spacing: -0.02em;
      cursor: pointer;
      min-width: 0;
    }
    .brand-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-badge {
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      color: #fff;
      border-radius: 7px;
      padding: 2px 6px;
      font-size: 0.7rem;
      font-weight: 900;
      flex-shrink: 0;
    }
    .top-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .icon-btn:active { transform: scale(0.95); }
    .lang-toggle {
      display: inline-flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 7px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .screen {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .screen.active { display: flex; }

    .hero-card, .panel {
      background: rgba(21, 29, 51, 0.93);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 12px 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    .hero-title {
      font-size: 1.16rem;
      font-weight: 800;
      margin: 0 0 4px;
      line-height: 1.24;
    }
    .hero-sub {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.42;
      margin: 0;
    }
    .science-note {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 11px;
      background: rgba(79, 140, 255, 0.11);
      border: 1px solid rgba(79, 140, 255, 0.28);
      font-size: 0.74rem;
      line-height: 1.4;
      color: #dbe7ff;
    }
    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 700;
      margin: 1px 0 5px;
    }
    .speed-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .speed-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 8px;
      text-align: left;
      cursor: pointer;
    }
    .speed-btn.active {
      border-color: var(--accent-2);
      background: rgba(56, 189, 248, 0.15);
    }
    .speed-btn strong { display: block; font-size: 0.79rem; margin-bottom: 1px; }
    .speed-btn span { display: block; font-size: 0.68rem; color: var(--muted); line-height: 1.2; }

    .cat-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }
    .cat-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: linear-gradient(135deg, var(--card), var(--card-2));
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      padding: 11px 12px;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease;
      text-align: left;
    }
    .cat-btn:active { transform: scale(0.985); }
    .cat-btn:hover { border-color: var(--accent); }
    .cat-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .cat-icon { font-size: 1.35rem; flex-shrink: 0; }
    .cat-title { font-weight: 800; font-size: 0.9rem; display: block; }
    .cat-desc { font-size: 0.72rem; color: var(--muted); display: block; margin-top: 2px; line-height: 1.28; }
    .cat-pill {
      background: rgba(255,255,255,0.08);
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent-2);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 700;
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #dbe7ff;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .back-btn:hover, .back-btn:active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(79, 140, 255, 0.16);
      color: #bcd5ff;
      font-size: 0.73rem;
      font-weight: 700;
    }

    .primary-btn, .secondary-btn {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 12px 15px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }
    .primary-btn {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.38);
    }
    .secondary-btn {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .primary-btn:active, .secondary-btn:active { transform: scale(0.985); }

    .timer-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .timer-track {
      flex: 1;
      height: 7px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
    }
    .timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--good), var(--accent-2));
      transition: width 0.05s linear;
    }
    .timer-bar.danger { background: linear-gradient(90deg, var(--bad), var(--warn)); }
    .timer-num {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 0.88rem;
      min-width: 44px;
      text-align: right;
    }

    .mission-bar {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .mission-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      border: 1.5px solid transparent;
    }
    .mission-pill.mode-target4 {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.45);
      color: #7dd3fc;
    }
    .mission-pill.mode-pair4 {
      background: rgba(168, 85, 247, 0.16);
      border-color: rgba(168, 85, 247, 0.45);
      color: #d8b4fe;
    }
    .mission-pill.mode-odd4 {
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.48);
      color: #fcd34d;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 7px;
      min-height: 0;
    }
    .target-top {
      display: flex;
      justify-content: center;
      width: 100%;
    }
    .target-card {
      width: 126px;
      background: var(--card);
      border: 2.5px solid var(--accent-2);
      border-radius: 13px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 480 / 504;
      box-shadow: 0 4px 16px rgba(56, 189, 248, 0.22);
    }
    .target-mask {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #131c34, #0d1326);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      z-index: 4;
      color: #7dd3fc;
      font-weight: 800;
      font-size: 0.74rem;
      text-align: center;
      padding: 6px;
    }
    .card-tag {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(11, 16, 32, 0.84);
      color: #fff;
      font-weight: 800;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 3;
    }
    .target-card .card-tag {
      background: var(--accent-2);
      color: #061224;
      border: none;
    }
    .choices-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-width: 356px;
      width: 100%;
      margin: 0 auto;
    }
    .stage.is-target4 .choices-4 {
      max-width: 306px;
      gap: 6px;
    }
    .face-card {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 13px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      aspect-ratio: 480 / 504;
      transition: transform 0.08s ease, border-color 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
    }
    .face-card.locked-blur img {
      filter: blur(14px) brightness(0.5);
      transform: scale(1.08);
    }
    .face-card img, .target-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .face-card.selected {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.35);
    }
    .face-card.correct {
      border-color: var(--good);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.42);
    }
    .face-card.wrong {
      border-color: var(--bad);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.42);
    }

    .thumb-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }
    .thumb-btn {
      background: var(--card-2);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-weight: 800;
      font-size: 0.92rem;
      padding: 9px 0;
      border-radius: 11px;
      cursor: pointer;
    }
    .thumb-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .thumb-btn.selected {
      background: var(--accent);
      border-color: var(--accent-2);
      color: #fff;
    }

    .explain-box {
      background: rgba(21, 29, 51, 0.96);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 9px 11px;
      font-size: 0.78rem;
      line-height: 1.4;
    }
    .verdict-line {
      font-weight: 800;
      font-size: 0.86rem;
      margin-bottom: 3px;
    }
    .verdict-good { color: var(--good); }
    .verdict-bad { color: var(--bad); }
    .explain-actions {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 7px;
    }
    .bio-btn {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #7dd3fc;
      border-radius: 11px;
      font-weight: 800;
      font-size: 0.79rem;
      padding: 9px 8px;
      cursor: pointer;
    }
    .bio-btn.active {
      background: var(--accent-2);
      color: #061224;
    }

    .score-big {
      font-size: 2.15rem;
      font-weight: 900;
      text-align: center;
      margin: 2px 0;
      background: linear-gradient(135deg, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0;
    }
    .stat-tile {
      background: var(--card-2);
      border-radius: 12px;
      padding: 8px 10px;
      text-align: center;
    }
    .stat-tile span { display: block; font-size: 0.72rem; color: var(--muted); }
    .stat-tile strong { font-size: 1rem; }

    .breakdown-wrap {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    .breakdown-wrap.show { display: flex; }
    .bd-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
    }
    .bd-label { width: 105px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bd-track { flex: 1; height: 7px; background: rgba(255,255,255,0.09); border-radius: 999px; overflow: hidden; }
    .bd-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius: 999px; }
    .bd-val { width: 82px; text-align: right; font-variant-numeric: tabular-nums; color: #dbe7ff; font-weight: 700; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 8px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 50;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand" onclick="goHome()">
        <span class="brand-badge">HARD</span>
        <span class="brand-title">Cross-Race Quiz</span>
      </div>
      <div class="top-controls">
        <button class="icon-btn" id="btn-top-link" onclick="shareGameLink()" title="Share URL">🔗 URL</button>
        <div class="lang-toggle">
          <button class="lang-btn" id="btn-de" onclick="setLang('de')">DE</button>
          <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
          <button class="lang-btn" id="btn-ko" onclick="setLang('ko')">KO</button>
        </div>
      </div>
    </div>

    <!-- HOME SCREEN -->
    <div class="screen active" id="screen-home">
      <div class="hero-card">
        <h1 class="hero-title" id="t-hero-title"></h1>
        <p class="hero-sub" id="t-hero-sub"></p>
        <div class="science-note" id="t-science-note"></div>
      </div>

      <div>
        <div class="section-label" id="t-speed-label"></div>
        <div class="speed-row">
          <button class="speed-btn active" id="speed-normal" onclick="setMode('normal')">
            <strong>⏱️ 5.0s</strong>
            <span id="t-speed-normal-desc"></span>
          </button>
          <button class="speed-btn" id="speed-blitz" onclick="setMode('blitz')">
            <strong>⚡ 3.0s</strong>
            <span id="t-speed-blitz-desc"></span>
          </button>
          <button class="speed-btn" id="speed-memory" onclick="setMode('memory')">
            <strong>🔥 Memory</strong>
            <span id="t-speed-memory-desc"></span>
          </button>
        </div>
      </div>

      <div>
        <div class="section-label" id="t-cat-label"></div>
        <div class="cat-grid">
          <button class="cat-btn" onclick="startGame('east')">
            <div class="cat-left">
              <span class="cat-icon">🌏</span>
              <div>
                <span class="cat-title" id="t-cat-east"></span>
                <span class="cat-desc" id="t-cat-east-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-east">6R</span>
          </button>
          <button class="cat-btn" onclick="startGame('black')">
            <div class="cat-left">
              <span class="cat-icon">🌍</span>
              <div>
                <span class="cat-title" id="t-cat-black"></span>
                <span class="cat-desc" id="t-cat-black-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-black">6R</span>
          </button>
          <button class="cat-btn" onclick="startGame('euro')">
            <div class="cat-left">
              <span class="cat-icon">🇪🇺</span>
              <div>
                <span class="cat-title" id="t-cat-euro"></span>
                <span class="cat-desc" id="t-cat-euro-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-euro">6R</span>
          </button>
          <button class="cat-btn" onclick="startGame('all')" style="border-color: rgba(56, 189, 248, 0.45);">
            <div class="cat-left">
              <span class="cat-icon">🎲</span>
              <div>
                <span class="cat-title" id="t-cat-all"></span>
                <span class="cat-desc" id="t-cat-all-desc"></span>
              </div>
            </div>
            <span class="cat-pill" id="pill-all">18 MIX</span>
          </button>
        </div>
      </div>
    </div>

    <!-- PLAY / REVIEW SCREEN (Direct No-Hint Flow) -->
    <div class="screen" id="screen-play">
      <div>
        <div class="hud" style="margin-bottom:4px;">
          <button class="back-btn" id="btn-back-play" onclick="goHome()"></button>
          <span id="play-progress"></span>
          <span id="play-score"></span>
        </div>
        <div class="timer-wrap" id="timer-wrap">
          <div class="timer-track"><div class="timer-bar" id="timer-bar"></div></div>
          <div class="timer-num" id="timer-num">5.0s</div>
        </div>
      </div>

      <div class="mission-bar">
        <div class="mission-pill mode-target4" id="mission-pill"></div>
      </div>

      <div class="stage" id="stage"></div>

      <div id="bottom-controls"></div>
    </div>

    <!-- RESULT SCREEN -->
    <div class="screen" id="screen-result">
      <div class="panel">
        <div class="badge" id="res-cat-badge" style="margin-bottom:6px;"></div>
        <div class="score-big" id="res-score"></div>
        <div style="text-align:center;font-weight:800;font-size:0.94rem;margin-bottom:6px;" id="res-rank"></div>
        <div class="stat-row">
          <div class="stat-tile">
            <span id="t-stat-acc"></span>
            <strong id="res-acc"></strong>
          </div>
          <div class="stat-tile">
            <span id="t-stat-time"></span>
            <strong id="res-time"></strong>
          </div>
        </div>
        <div class="breakdown-wrap" id="res-breakdown"></div>
        <div class="science-note" id="res-science"></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="primary-btn" id="btn-share" onclick="copyShare()"></button>
        <button class="secondary-btn" id="btn-switch-cat" onclick="goHome()"></button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>

// ==================== IMAGE PRELOADER & PAINT GATE ====================
const IMG_CACHE = new Map();
const LOADED_SET = new Set();

function getRoundUrls(r) {
  if (!r) return [];
  const urls = [];
  if (r.target && r.target.img) urls.push(r.target.img);
  if (r.cards) {
    Object.values(r.cards).forEach(c => {
      if (c && c.img) urls.push(c.img);
    });
  }
  return urls;
}

function preloadUrl(url) {
  if (IMG_CACHE.has(url)) return IMG_CACHE.get(url);
  const p = new Promise((resolve) => {
    const img = new Image();
    img.decoding = "async";
    let done = false;
    const finish = (ok, el) => {
      if (done) return;
      done = true;
      if (ok) LOADED_SET.add(url);
      else IMG_CACHE.delete(url);
      resolve(el || img);
    };
    const timeout = setTimeout(() => finish(false, img), 12000);
    img.onload = () => {
      clearTimeout(timeout);
      if (img.decode) {
        img.decode().then(() => finish(true, img)).catch(() => finish(true, img));
      } else {
        finish(true, img);
      }
    };
    img.onerror = () => {
      clearTimeout(timeout);
      const retry = new Image();
      retry.decoding = "async";
      const t2 = setTimeout(() => finish(false, retry), 10000);
      retry.onload = () => {
        clearTimeout(t2);
        if (retry.decode) {
          retry.decode().then(() => finish(true, retry)).catch(() => finish(true, retry));
        } else {
          finish(true, retry);
        }
      };
      retry.onerror = () => {
        clearTimeout(t2);
        finish(false, retry);
      };
      retry.src = url + (url.includes("?") ? "&" : "?") + "retry=1";
    };
    img.src = url;
  });
  IMG_CACHE.set(url, p);
  return p;
}

async function preloadRound(r) {
  const urls = getRoundUrls(r);
  if (!urls.length) return;
  await Promise.all(urls.map(u => preloadUrl(u)));
}

function isRoundReadyInMemory(r) {
  return getRoundUrls(r).every(u => LOADED_SET.has(u));
}

let bgQueueRunning = false;
async function warmDeckInBackground(roundsList) {
  if (bgQueueRunning) return;
  bgQueueRunning = true;
  try {
    for (const r of roundsList) {
      if (!isRoundReadyInMemory(r)) {
        await preloadRound(r);
      }
    }
  } finally {
    bgQueueRunning = false;
  }
}

async function waitForStagePaint() {
  const imgs = Array.from(document.querySelectorAll("#stage img"));
  await Promise.all(imgs.map(img => new Promise(res => {
    if (img.complete && img.naturalWidth > 0) {
      if (img.decode) img.decode().then(res).catch(res);
      else res();
      return;
    }
    const done = () => res();
    img.addEventListener("load", done, { once: true });
    img.addEventListener("error", done, { once: true });
    setTimeout(done, 4000);
  })));
  await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
}

    if (q && UI[q]) return q;
    const nav = (navigator.language || "").toLowerCase();
    if (nav.startsWith("ko")) return "ko";
    if (nav.startsWith("de")) return "de";
  } catch (e) {}
  return "en";
}

function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepareRoundInstance(raw) {
  const origKeys = ["A", "B", "C", "D"];
  const shuffledOrig = shuffleArr(origKeys);
  const slotOf = {};
  const newCards = {};
  origKeys.forEach((dispKey, i) => {
    const oKey = shuffledOrig[i];
    slotOf[oKey] = dispKey;
    newCards[dispKey] = raw.cards[oKey];
  });
  const newAns = raw.answer.split("").map(ch => slotOf[ch]).sort().join("");
  const newExplain = {};
  ["de", "en", "ko"].forEach(l => {
    newExplain[l] = raw.explain[l].replace(/\[\[([ABCD])\]\]/g, (_, k) => slotOf[k]);
  });
  return {
    ...raw,
    cards: newCards,
    answer: newAns,
    explain: newExplain
  };
}

function goHome() {
  roundSeq++;
  stopTimer();
  phase = "home";
  showScreen("screen-home");
}

function startGame(cat) {
  activeCat = cat;
  const rawPool = cat === "all" ? ROUNDS : ROUNDS.filter(r => r.cat === cat);
  const seenIds = new Set();
  const uniquePool = [];
  for (const r of rawPool) {
    if (seenIds.has(r.id)) continue;
    seenIds.add(r.id);
    uniquePool.push(r);
  }
  deck = shuffleArr(uniquePool).map(prepareRoundInstance);
  idx = 0;
  score = 0;
  historyLog = [];
  launchRound();
  warmDeckInBackground(deck);
}

async function launchRound() {
  const mySeq = ++roundSeq;
  stopTimer();
  const r = deck[idx];
  picked = [];
  bioOn = false;
  lastVerdict = null;
  targetHidden = false;
  currentLimitSec = getRoundTimeSec(r);

  const bar = document.getElementById("timer-bar");
  const num = document.getElementById("timer-num");
  bar.style.width = "100%";
  bar.classList.remove("danger");
  num.textContent = currentLimitSec.toFixed(1) + "s";

  showScreen("screen-play");

  // 1. Preload images into RAM if not cached yet
  if (!isRoundReadyInMemory(r)) {
    phase = "loading";
    renderPlayOrReview();
    await preloadRound(r);
    if (mySeq !== roundSeq) return;
  }

  // 2. Memory Hardcore phase for target4 rounds: show TARGET for 1.8s with choices blurred, then hide TARGET!
  if (gameMode === "memory" && r.type === "target4") {
    phase = "memorize";
    targetHidden = false;
    renderPlayOrReview();
    await waitForStagePaint();
    if (mySeq !== roundSeq) return;

    const memSec = 1.8;
    const memStart = performance.now();
    await new Promise(resolve => {
      timerId = setInterval(() => {
        if (mySeq !== roundSeq) {
          stopTimer();
          resolve();
          return;
        }
        const el = (performance.now() - memStart) / 1000;
        const left = Math.max(0, memSec - el);
        bar.style.width = ((left / memSec) * 100) + "%";
        num.textContent = left.toFixed(1) + "s";
        if (left <= 0) {
          stopTimer();
          resolve();
        }
      }, 40);
    });
    if (mySeq !== roundSeq) return;
    targetHidden = true;
  } else {
    phase = "loading";
    renderPlayOrReview();
    await waitForStagePaint();
    if (mySeq !== roundSeq) return;
    // Brief 0.32s visual beat so player registers mission color pill & painted faces before clock ticks
    await new Promise(res => setTimeout(res, 320));
    if (mySeq !== roundSeq) return;
  }

  // 3. Start live play timer!
  phase = "play";
  bar.style.width = "100%";
  bar.classList.remove("danger");
  num.textContent = currentLimitSec.toFixed(1) + "s";
  renderPlayOrReview();

  startTs = performance.now();
  timerId = setInterval(() => {
    const elapsed = (performance.now() - startTs) / 1000;
    const left = Math.max(0, currentLimitSec - elapsed);
    const pct = (left / currentLimitSec) * 100;
    bar.style.width = pct + "%";
    if (left <= 1.4) bar.classList.add("danger");
    num.textContent = left.toFixed(1) + "s";
    if (left <= 0) {
      stopTimer();
      finishRound("timeout");
    }
  }, 45);

  if (idx + 1 < deck.length) {
    preloadRound(deck[idx + 1]);
  }
}

function stopTimer() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
  }
}

function syncPairSelectionUI() {
  document.querySelectorAll("[data-choice-card]").forEach(el => {
    const k = el.getAttribute("data-choice-card");
    el.classList.toggle("selected", picked.includes(k));
  });
  document.querySelectorAll("[data-choice-btn]").forEach(el => {
    const k = el.getAttribute("data-choice-btn");
    el.classList.toggle("selected", picked.includes(k));
  });
}

function tapChoice(key) {
  if (phase !== "play") return;
  const r = deck[idx];
  if (r.type === "pair4") {
    if (picked.includes(key)) {
      picked = picked.filter(k => k !== key);
    } else if (picked.length < 2) {
      picked.push(key);
    }
    if (picked.length === 2) {
      stopTimer();
      const sorted = [...picked].sort().join("");
      finishRound(sorted === r.answer ? "correct" : "wrong");
      return;
    }
    syncPairSelectionUI();
  } else {
    picked = [key];
    stopTimer();
    finishRound(key === r.answer ? "correct" : "wrong");
  }
}

function finishRound(verdict) {
  const elapsed = Math.min(currentLimitSec, (performance.now() - startTs) / 1000);
  const isOk = verdict === "correct";
  if (isOk) score++;
  historyLog.push({ cat: deck[idx].cat, correct: isOk, elapsed });
  lastVerdict = verdict;
  targetHidden = false;
  phase = "review";
  renderPlayOrReview();
}

        ${renderPortraitCard(r.target, phase === "review" && bioOn, true)}
      </div>
    </div>`;
  }

  html += `<div class="choices-4">`;
  keys.forEach(k => {
    let cls = "face-card";
    const isAns = ansChars.includes(k);
    const isPicked = picked.includes(k);
    if (phase === "memorize") cls += " locked-blur";
    if ((phase === "play" || phase === "loading") && isPicked) cls += " selected";
    if (phase === "review") {
      if (isAns) cls += " correct";
      else if (isPicked) cls += " wrong";
    }
    const showCardBio = phase === "review" && bioOn && (isAns || isPicked);
    html += `<div class="${cls}" data-choice-card="${k}" onclick="tapChoice('${k}')">
      <span class="card-tag">${k}</span>
      ${renderPortraitCard(r.cards[k], showCardBio, isAns)}
    </div>`;
  });
  html += `</div>`;
  stage.innerHTML = html;

  const bottom = document.getElementById("bottom-controls");
  if (phase !== "review") {
    const disabledAttr = phase !== "play" ? "disabled" : "";
    let btns = `<div class="thumb-bar">`;
    keys.forEach(k => {
      const sel = picked.includes(k) ? "selected" : "";
      btns += `<button class="thumb-btn ${sel}" ${disabledAttr} data-choice-btn="${k}" onclick="tapChoice('${k}')">${k}</button>`;
    });
    btns += `</div>`;
    bottom.innerHTML = btns;
  } else {
    const vText = lastVerdict === "correct" ? t.correctMsg : lastVerdict === "timeout" ? t.timeoutMsg : t.wrongMsg;
    const vCls = lastVerdict === "correct" ? "verdict-good" : "verdict-bad";
    const nextLbl = idx + 1 < deck.length ? t.nextBtn : t.finishBtn;
    bottom.innerHTML = `<div class="explain-box">
      <div class="verdict-line ${vCls}">${vText}</div>
      <div style="color:#d6e0f8;margin-bottom:7px;">${r.explain[lang]}</div>
      <div class="explain-actions">
        <button class="bio-btn ${bioOn ? 'active' : ''}" onclick="toggleBio()">${t.bioBtn}</button>
        <button class="primary-btn" style="padding:9px 12px;font-size:0.85rem;" onclick="nextRound()">${nextLbl}</button>
      </div>
    </div>`;
  }
}

function nextRound() {
  if (idx + 1 < deck.length) {
    idx++;
    launchRound();
  } else {
    phase = "result";
    renderResult();
    showScreen("screen-result");
  }
}

function renderResult() {
  const t = UI[lang];
  const pct = Math.round((score / deck.length) * 100);
  const avg = historyLog.length ? (historyLog.reduce((a, b) => a + b.elapsed, 0) / historyLog.length).toFixed(2) : "0.00";
  let rIdx = pct >= 83 ? 0 : pct >= 55 ? 1 : pct >= 33 ? 2 : 3;

  document.getElementById("res-cat-badge").textContent = catName(activeCat);
  document.getElementById("res-score").textContent = `${score} / ${deck.length}`;
  document.getElementById("res-rank").textContent = t.ranks[rIdx];
  document.getElementById("t-stat-acc").textContent = t.statAcc;
  document.getElementById("t-stat-time").textContent = t.statTime;
  document.getElementById("res-acc").textContent = `${pct}%`;
  document.getElementById("res-time").textContent = `${avg}s`;
  document.getElementById("res-science").innerHTML = t.resScience;
  document.getElementById("btn-share").textContent = t.shareBtn;
  document.getElementById("btn-switch-cat").textContent = t.switchCatBtn;

  const bdEl = document.getElementById("res-breakdown");
  if (activeCat === "all") {
    const groups = [
      { key: "east", label: t.shortEast },
      { key: "black", label: t.shortBlack },
      { key: "euro", label: t.shortEuro }
    ];
    let bdHtml = "";
    groups.forEach(g => {
      const items = historyLog.filter(x => x.cat === g.key);
      if (!items.length) return;
      const hits = items.filter(x => x.correct).length;
      const gPct = Math.round((hits / items.length) * 100);
      const gAvg = (items.reduce((a, b) => a + b.elapsed, 0) / items.length).toFixed(1);
      bdHtml += `<div class="bd-row">
        <span class="bd-label">${g.label}</span>
        <div class="bd-track"><div class="bd-fill" style="width:${gPct}%;"></div></div>
        <span class="bd-val">${hits}/${items.length} (${gAvg}s)</span>
      </div>`;
    });
    bdEl.innerHTML = bdHtml;
    bdEl.classList.add("show");
  } else {
    bdEl.innerHTML = "";
    bdEl.classList.remove("show");
  }
}

function getCleanShareUrl() {
  try {
    if (window.location.protocol.startsWith("http")) {
      return window.location.origin + window.location.pathname;
    }
  } catch (e) {}
  return "https://kaao7628-del.github.io/cross-race-challenge/";
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

async function shareGameLink() {
  const t = UI[lang];
  const url = getCleanShareUrl();
  if (navigator.share) {
    try {
      await navigator.share({ title: t.heroTitle, url });
      return;
    } catch (e) {}
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(url);
  }
  showToast(t.linkCopied);
}

async function copyShare() {
  const t = UI[lang];
  const avg = historyLog.length ? (historyLog.reduce((a, b) => a + b.elapsed, 0) / historyLog.length).toFixed(2) : "0.00";
  const modeStr = gameMode === "memory" ? "Memory Hardcore 🔥" : gameMode === "blitz" ? "Blitz 3.0s ⚡" : "Normal 5.0s ⏱️";
  const url = getCleanShareUrl();
  let msg = "";
  if (lang === "de") {
    msg = `🧠 Cross-Race Hardcore-Test (${catName(activeCat)} | ${modeStr})\nTreffer: ${score}/${deck.length} (Ø ${avg}s)\nSchaffst du mehr ohne Tipps?\n${url}`;
  } else if (lang === "ko") {
    msg = `🧠 타인종 안면인식 하드코어 테스트 (${catName(activeCat)} | ${modeStr})\n점수: ${score}/${deck.length} (평균 ${avg}초)\n노힌트 도플갱어 함정, 바로 도전해 보세요!\n${url}`;
  } else {
    msg = `🧠 Cross-Race Hardcore Challenge (${catName(activeCat)} | ${modeStr})\nScore: ${score}/${deck.length} (Avg ${avg}s)\nZero hints — try it now:\n${url}`;
  }

  if (navigator.share) {
    try {
      await navigator.share({ title: t.heroTitle, text: msg });
      return;
    } catch (e) {}
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(msg);
  }
  showToast(t.copied);
}

setLang(lang);
setTimeout(() => warmDeckInBackground(ROUNDS.slice(0, 6)), 300);
</script>
